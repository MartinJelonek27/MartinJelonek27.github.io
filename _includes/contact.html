<!-- SECTION 4: Contact-->
{% comment %} formspree-key in _config.yml can be the form ID (e.g. mlgvrjbp) or the full https://formspree.io/f/... URL {% endcomment %}
{% assign formspree_id = site.formspree-key | strip | split: "/" | last %}
<section id="contact" class= "contact-section">
    <h2>Contact</h2>

    <div class="group">
      
        <form action="https://formspree.io/f/{{ formspree_id }}" method="POST">
            <label for="name">Name</label>
            <input type="text" id="name" name="name">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message</label>
            <textarea id="message" cols = "30" rows="10" name="message" required></textarea>

            <button type="submit">Send Message</button>
        </form>
    </div>
  </section>
